<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>osu! Enhancer</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="popup__header">
    <span class="popup__logo">osu!</span>
    <span class="popup__title">Enhancer</span>
  </header>

  <main class="popup__list">
    <a class="popup__notice" id="rosuNotice" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
    <label class="toggle">
      <span>Dark theme</span>
      <input type="checkbox" data-toggle="darkTheme" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>PP if FC labels</span>
      <input type="checkbox" data-toggle="ppIfFc" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Beatmap cover art</span>
      <input type="checkbox" data-toggle="coverArt" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Downloadable player card</span>
      <input type="checkbox" data-toggle="playerCard" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Difficulty names + star rating on picker</span>
      <input type="checkbox" data-toggle="pickerDiffNames" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Max star rating on listing cards</span>
      <input type="checkbox" data-toggle="listingMaxSr" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Cover download + copy name buttons on beatmap pages</span>
      <input type="checkbox" data-toggle="coverDownloadButton" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>PP calculator on beatmap pages</span>
      <input type="checkbox" data-toggle="beatmapPpCalculator" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Score age period highlight (Best Performance)</span>
      <input type="checkbox" data-toggle="scoreAgeHighlight" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Purple accent color on profile pages</span>
      <input type="checkbox" data-toggle="profileAccentColor" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Target rank pp calculator on profile page</span>
      <input type="checkbox" data-toggle="targetRankCalculator" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>PP potential panel on profile page</span>
      <input type="checkbox" data-toggle="ppPotential" />
      <span class="toggle__switch"></span>
    </label>
    <label class="toggle">
      <span>Player rank next to usernames (needs osu! API below)</span>
      <input type="checkbox" data-toggle="showLeaderboardRank" />
      <span class="toggle__switch"></span>
    </label>
    <hr />
    <label class="select-row">
      <span>Default mode on beatmap listing</span>
      <select data-select-toggle="defaultBeatmapMode">
        <option value="osu">osu!</option>
        <option value="taiko">osu!taiko</option>
        <option value="fruits">osu!catch</option>
        <option value="mania">osu!mania</option>
        <option value="any">Any (no default)</option>
      </select>
    </label>
    <label class="select-row">
      <span>PP calculation engine</span>
      <select data-select-toggle="ppEngine">
        <option value="rosu">rosu-pp (bundled)</option>
        <option value="official">Official game code (ppy)</option>
      </select>
    </label>
    <hr />
    <div class="api-section">
      <div class="api-section__heading">osu! API</div>
      <label class="api-section__row">
        <span>Client ID</span>
        <input type="text" data-api-toggle="osuApiClientId" autocomplete="off" spellcheck="false" />
      </label>
      <label class="api-section__row">
        <span>Client secret</span>
        <input type="password" data-api-toggle="osuApiClientSecret" autocomplete="off" spellcheck="false" />
      </label>
    </div>
    <div class="api-section">
      <div class="api-section__heading">Rank data (target rank calculator)</div>
      <label class="api-section__row">
        <span>Country code</span>
        <input type="text" id="snapshotCountry" maxlength="2" placeholder="e.g. FR" autocomplete="off" spellcheck="false" />
      </label>
      <label class="api-section__row">
        <span>Mode</span>
        <select id="snapshotMode">
          <option value="osu">osu!</option>
          <option value="taiko">osu!taiko</option>
          <option value="fruits">osu!catch</option>
          <option value="mania">osu!mania</option>
        </select>
      </label>
      <button type="button" class="fetch-btn" id="snapshotFetch">Fetch all rankings</button>
      <div class="fetch-status" id="snapshotStatus"></div>
    </div>
  </main>

  <footer class="popup__footer">
    Changes apply instantly — no refresh needed.<br />
    Medal toggles live as buttons on the Medals page. A ⚙ settings button
    also floats in the bottom-left corner of every osu! page.
  </footer>

  <script src="../src/storage.js"></script>
  <script src="../src/rosu-update-shared.js"></script>
  <script src="../src/selectors.js"></script>
  <script src="../src/target-rank.js"></script>
  <script src="popup.js"></script>
</body>
</html>
